[package]
name = "hotaru_mqtt"
version = "0.8.2"
edition = "2024"
authors = ["Redstone <redstone@fds.moe>"]
description = "MQTT support for the Hotaru framework"
license = "MIT"
repository = "https://github.com/hotaru/hotaru"
keywords = ["mqtt", "hotaru", "broker"]
categories = ["network-programming", "web-programming"]

[dependencies]
bitflags = "2"
bytes = "1"
async-trait = "0.1.88"
dashmap = "6"
hotaru_core = "0.8.2"
tokio = { version = "1.28", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.28", features = ["io-util", "macros", "net", "rt", "sync", "time", "test-util"] }
hotaru_http = "0.8.2"
