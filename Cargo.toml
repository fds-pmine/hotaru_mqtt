[workspace]
resolver = "2"
members = [
    "hotaru_mqtt",
    "hotaru_mqtt_broker",
]

[workspace.package]
edition = "2024"
authors = ["Redstone <redstone@fds.moe>", "JerrySu <jerrysu@fds.moe>"]
repository = "https://github.com/Field-of-Dreams-Studio/hotaru"
license = "MIT"

[workspace.dependencies]
hotaru_core = "0.8.2"
hotaru_tls = "0.8.1"
hotaru_http = "0.8.2"
tokio = { version = "1.28", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
async-trait = "0.1.88"
dashmap = "6"
bytes = "1"
bitflags = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
