[package]
name = "hotaru_mqtt"
version = "0.8.2"
edition = "2024"
authors = ["Redstone <redstone@fds.moe>"]
description = "MQTT support for the Hotaru framework"
license = "MIT"
repository = "https://github.com/hotaru/hotaru"
keywords = ["mqtt", "hotaru", "broker"]
categories = ["network-programming", "web-programming"]

[dependencies]
bitflags = "2"
bytes = "1"
async-trait = "0.1.88"
dashmap = "6"
hotaru_core = "=0.8.6"
hotaru_io_tokio = "=0.8.6"
tokio = { version = "1.28", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
hotaru_rt_embassy = { version = "=0.8.6", default-features = false, features = ["std"], optional = true }
embassy-executor = { version = "0.10", default-features = false, features = ["platform-std", "executor-thread"], optional = true }

[dev-dependencies]
tokio = { version = "1.28", features = ["io-util", "macros", "net", "rt", "sync", "time", "test-util"] }
hotaru_http = "=0.8.6"

[features]
embassy-example = ["dep:hotaru_rt_embassy", "dep:embassy-executor"]

[[example]]
name = "embassy_client"
required-features = ["embassy-example"]
